<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Portal - Sovereign Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');
        body { font-family: 'Rajdhani', sans-serif; background-color: #020617; color: #94a3b8; }
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; text-transform: uppercase; letter-spacing: 2px; }
        .system-border { border: 1px solid #0ea5e9; box-shadow: 0 0 10px rgba(14, 165, 233, 0.2); }
        .system-bg { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); }
        .neon-text { color: #0ea5e9; text-shadow: 0 0 8px rgba(14, 165, 233, 0.6); }
        .neon-bg { background-color: #0ea5e9; box-shadow: 0 0 15px rgba(14, 165, 233, 0.5); }
        #sidebar { transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); width: 16rem; }
        #sidebar.collapsed { width: 5rem; }
        #sidebar.collapsed .link-text, #sidebar.collapsed .portal-title { display: none; }
        #sidebar.collapsed .nav-btn { justify-content: center; padding-left: 0; padding-right: 0; }
        .nav-btn:hover { color: #0ea5e9; text-shadow: 0 0 10px #0ea5e9; }
        .nav-active { background: linear-gradient(90deg, rgba(14, 165, 233, 0.2) 0%, transparent 100%); color: #0ea5e9; border-left: 4px solid #0ea5e9; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-left: 1px solid #1e293b; border-top: 1px solid #1e293b; }
        .calendar-day { min-height: 110px; border-right: 1px solid #1e293b; border-bottom: 1px solid #1e293b; background: #0f172a; transition: 0.3s; }
        input, select, textarea { background: #0f172a !important; border: 1px solid #334155 !important; color: #f8fafc !important; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #0ea5e9; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside id="sidebar" class="bg-[#010409] border-r border-slate-800 flex flex-col shadow-2xl z-50">
        <div class="p-6 flex items-center justify-between border-b border-slate-800">
            <h1 class="portal-title neon-text text-sm font-bold truncate">SYSTEM</h1>
            <button onclick="toggleSidebar()" class="text-sky-400 hover:scale-110"><i class="fas fa-bars text-xl"></i></button>
        </div>
        <nav class="p-4 space-y-2 flex-1 overflow-y-auto">
            <button onclick="showSection('home')" id="home-btn" class="nav-btn w-full flex items-center p-3 rounded" title="Home"><i class="fas fa-home w-8"></i><span class="link-text ml-2">HOME</span></button>
            <button onclick="showSection('study')" id="study-btn" class="nav-btn w-full flex items-center p-3 rounded" title="Study"><i class="fas fa-graduation-cap w-8"></i><span class="link-text ml-2">STUDY</span></button>
            <button onclick="showSection('notes')" id="notes-btn" class="nav-btn w-full flex items-center p-3 rounded" title="Notes"><i class="fas fa-sticky-note w-8"></i><span class="link-text ml-2">NOTES</span></button>
            <button onclick="showSection('task')" id="task-btn" class="nav-btn w-full flex items-center p-3 rounded" title="Tasks"><i class="fas fa-tasks w-8"></i><span class="link-text ml-2">TASKS</span></button>
            <button onclick="showSection('event')" id="event-btn" class="nav-btn w-full flex items-center p-3 rounded" title="Events"><i class="fas fa-bell w-8"></i><span class="link-text ml-2">EVENTS</span></button>
            <button onclick="showSection('calendar')" id="calendar-btn" class="nav-btn w-full flex items-center p-3 rounded" title="Calendar"><i class="fas fa-calendar-alt w-8"></i><span class="link-text ml-2">CALENDAR</span></button>
            <button onclick="showSection('wallet')" id="wallet-btn" class="nav-btn w-full flex items-center p-3 rounded" title="Wallet"><i class="fas fa-wallet w-8"></i><span class="link-text ml-2">WALLET</span></button>
        </nav>
        <div class="p-4 text-[8px] text-center border-t border-slate-800 tracking-[3px] text-slate-600">V-U PK</div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-[#020617]/80 border-b border-slate-800 px-8 py-4 flex justify-between items-center backdrop-blur-md">
            <h1 id="page-title" class="neon-text text-lg">HOME</h1>
            <div id="header-study-info" class="text-xs font-bold text-slate-500 uppercase italic">APRIL 2026</div>
        </header>

        <div class="p-8 overflow-y-auto h-full space-y-8">
            
            <div id="home-section" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="system-bg system-border p-6 rounded-lg"><h3 class="text-[10px] text-sky-400 mb-4">Task Focus</h3><div id="home-task-display" class="text-white font-bold italic text-sm">No tasks.</div></div>
                <div class="system-bg system-border p-6 rounded-lg"><h3 class="text-[10px] text-sky-400 mb-4">Next Event</h3><div id="home-event-display" class="text-white font-bold italic text-sm">No events.</div></div>
                <div class="system-bg system-border p-6 rounded-lg border-emerald-500/30"><h3 class="text-[10px] text-emerald-400 mb-4">Balance</h3><div id="home-wallet-display" class="text-2xl font-black text-emerald-400">0.00</div></div>
            </div>

            <div id="study-section" class="hidden space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="system-bg system-border rounded-lg p-6">
                        <div class="text-sky-400 font-bold mb-4 uppercase text-xs">Academic Profile</div>
                        <form id="studyProfileForm" class="space-y-4">
                            <input type="text" id="studyModule" placeholder="Module Name" class="w-full p-2 rounded text-sm">
                            <input type="text" id="studyYear" placeholder="Year in Study" class="w-full p-2 rounded text-sm">
                            <button type="submit" class="neon-bg text-white font-bold py-2 rounded w-full text-[10px]">UPDATE PROFILE</button>
                        </form>
                    </div>
                    <div class="system-bg system-border rounded-lg p-6">
                        <div class="text-sky-400 font-bold mb-4 uppercase text-xs" id="subj-form-title">Add Subject</div>
                        <form id="subjectForm" class="space-y-2">
                            <div class="flex gap-2"><input type="text" id="subjCode" placeholder="Code" class="w-1/3 p-2 rounded text-sm"><input type="text" id="subjName" placeholder="Name" class="w-2/3 p-2 rounded text-sm"></div>
                            <textarea id="subjDesc" placeholder="Description" class="w-full p-2 rounded text-sm"></textarea>
                            <button type="submit" id="subjSubmitBtn" class="neon-bg text-white font-bold py-2 rounded w-full text-[10px]">REGISTER SUBJECT</button>
                        </form>
                    </div>
                </div>
                <div class="system-bg system-border rounded-lg overflow-hidden">
                    <table class="w-full text-left text-sm"><thead class="bg-slate-900/50 text-[10px] text-sky-400"><tr><th class="p-4">CODE</th><th class="p-4">SUBJECT</th><th class="p-4">DESC</th><th class="p-4 text-right">ACTIONS</th></tr></thead><tbody id="subjectList" class="divide-y divide-slate-800"></tbody></table>
                </div>
            </div>

            <div id="notes-section" class="hidden space-y-6">
                <div class="system-bg system-border rounded-lg p-6">
                    <div class="text-sky-400 font-bold mb-4 uppercase text-xs" id="note-form-title">Archive Knowledge</div>
                    <form id="noteForm" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4"><input type="text" id="noteTitle" placeholder="Note Title" class="p-2 rounded text-sm"><select id="noteSubject" class="p-2 rounded text-sm"><option value="General">General</option></select></div>
                        <textarea id="noteContent" placeholder="Enter notes..." rows="4" class="w-full p-2 rounded text-sm"></textarea>
                        <button type="submit" id="noteSubmitBtn" class="neon-bg text-white font-bold py-2 rounded w-full text-xs uppercase">Store Note</button>
                    </form>
                </div>
                <div id="notes-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>

            <div id="task-section" class="hidden space-y-6">
                <div class="system-bg system-border rounded-lg p-6">
                    <div class="text-sky-400 font-bold mb-4 uppercase text-xs">Quest Log</div>
                    <form id="taskForm" class="grid grid-cols-2 gap-4">
                        <input type="text" id="taskName" placeholder="Task Name" class="p-2 rounded text-sm"><select id="taskCycle" class="p-2 rounded text-sm"><option>Daily</option><option>Weekly</option><option>14 Days</option><option>Monthly</option></select>
                        <textarea id="taskDesc" placeholder="Description" class="col-span-2 p-2 rounded text-sm"></textarea>
                        <button type="submit" id="taskSubmitBtn" class="neon-bg text-white py-2 rounded text-xs col-span-2">COMMENCE</button>
                    </form>
                </div>
                <div class="system-bg system-border rounded-lg overflow-hidden"><table class="w-full text-left"><tbody id="taskList" class="divide-y divide-slate-800"></tbody></table></div>
            </div>

            <div id="event-section" class="hidden space-y-6">
                <div class="system-bg system-border rounded-lg p-6">
                    <div class="text-sky-400 font-bold mb-4 uppercase text-xs">Event Scheduler</div>
                    <form id="eventForm" class="grid grid-cols-2 gap-4">
                        <input type="text" id="eventName" placeholder="Event Name" class="p-2 rounded text-sm"><input type="date" id="eventDate" class="p-2 rounded text-sm">
                        <textarea id="eventNotes" placeholder="Notes" class="col-span-2 p-2 rounded text-sm"></textarea>
                        <button type="submit" id="eventSubmitBtn" class="neon-bg text-white py-2 rounded text-xs col-span-2">SAVE EVENT</button>
                    </form>
                </div>
                <div class="system-bg system-border rounded-lg overflow-hidden"><table class="w-full text-left text-sm"><tbody id="eventList" class="divide-y divide-slate-800"></tbody></table></div>
            </div>

            <div id="calendar-section" class="hidden space-y-4">
                <div class="flex justify-between items-center system-bg system-border p-4 rounded-lg">
                    <div class="flex space-x-1">
                        <button onclick="setCalView('day')" id="day-btn" class="cal-v-btn px-4 py-1 text-[10px] font-bold border border-slate-700 rounded">DAY</button>
                        <button onclick="setCalView('week')" id="week-btn" class="cal-v-btn px-4 py-1 text-[10px] font-bold border border-slate-700 rounded">WEEK</button>
                        <button onclick="setCalView('month')" id="month-btn" class="cal-v-btn px-4 py-1 text-[10px] font-bold border border-slate-700 rounded view-active">MONTH</button>
                    </div>
                    <div class="flex items-center space-x-6 text-sky-400">
                        <button onclick="navCal(-1)"><i class="fas fa-chevron-left"></i></button>
                        <h2 class="font-bold w-32 text-center" id="cal-date-label">April 2026</h2>
                        <button onclick="navCal(1)"><i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>
                <div id="cal-body-container" class="system-bg system-border rounded-lg overflow-hidden min-h-[400px]"></div>
            </div>

            <div id="wallet-section" class="hidden space-y-6">
                <div class="system-bg system-border rounded-lg p-6">
                    <div class="text-emerald-400 font-bold mb-4 uppercase text-xs">Inventory Gold</div>
                    <form id="walletForm" class="grid grid-cols-3 gap-4">
                        <select id="walletType" class="p-2 rounded text-sm"><option value="deposit">Loot</option><option value="withdraw">Expense</option></select>
                        <input type="number" id="walletAmount" step="0.01" placeholder="Amount" class="p-2 rounded text-sm"><input type="text" id="walletDesc" placeholder="Source" class="p-2 rounded text-sm">
                        <button type="submit" id="walletSubmitBtn" class="bg-emerald-600 text-white py-2 rounded text-xs col-span-3">PROCESS</button>
                    </form>
                </div>
                <div class="text-center p-4"><h3 class="text-[10px] text-slate-500 mb-1">BALANCE</h3><div id="totalBalance" class="text-5xl font-black text-emerald-400">0.00</div></div>
                <div class="system-bg system-border rounded-lg overflow-hidden"><table class="w-full text-left text-sm"><tbody id="walletList" class="divide-y divide-slate-800"></tbody></table></div>
            </div>
        </div>
    </main>

    <script>
        let tasks = [], events = [], transactions = [], subjects = [], notes = [], balance = 0.0, calView = 'month', calOff = 0;
        let edTId = null, edEId = null, edWId = null, edSId = null, edNId = null;

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }
        function showSection(s) {
            ['home','study','notes','task','event','calendar','wallet'].forEach(id => document.getElementById(`${id}-section`).classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('nav-active'));
            document.getElementById(`${s}-section`).classList.remove('hidden');
            document.getElementById(`${s}-btn`).classList.add('nav-active');
            document.getElementById('page-title').innerText = s.toUpperCase();
            if(s === 'home') updateHome(); if(s === 'calendar') renderCalendar(); if(s === 'notes') syncNoteSubjects();
        }

        // --- STUDY/SUBJECT ---
        document.getElementById('studyProfileForm').addEventListener('submit', (e) => { e.preventDefault(); document.getElementById('header-study-info').innerText = `${document.getElementById('studyModule').value} | ${document.getElementById('studyYear').value}`; });
        document.getElementById('subjectForm').addEventListener('submit', (e) => {
            e.preventDefault(); const c = document.getElementById('subjCode').value, n = document.getElementById('subjName').value, d = document.getElementById('subjDesc').value;
            if(edSId) { subjects = subjects.map(s => s.id === edSId ? { id: edSId, code: c, name: n, desc: d } : s); edSId = null; document.getElementById('subjSubmitBtn').innerText = "REGISTER SUBJECT"; }
            else { subjects.push({ id: Date.now(), code: c, name: n, desc: d }); }
            renSubj(); e.target.reset();
        });
        function renSubj() { const l = document.getElementById('subjectList'); l.innerHTML = ""; subjects.forEach(s => l.innerHTML += `<tr><td class="p-4 text-sky-400 font-bold">${s.code}</td><td class="p-4 text-white">${s.name}</td><td class="p-4 text-xs text-slate-500">${s.desc}</td><td class="p-4 text-right"><button onclick="edS(${s.id})" class="text-sky-400 mr-2"><i class="fas fa-edit"></i></button><button onclick="remS(${s.id})" class="text-red-900"><i class="fas fa-trash"></i></button></td></tr>`); }
        function edS(id) { const s=subjects.find(x=>x.id===id); edSId=id; document.getElementById('subjCode').value=s.code; document.getElementById('subjName').value=s.name; document.getElementById('subjDesc').value=s.desc; document.getElementById('subjSubmitBtn').innerText="UPDATE SUBJECT"; }
        function remS(id) { subjects=subjects.filter(s=>s.id!==id); renSubj(); }

        // --- NOTES ---
        function syncNoteSubjects() { const d = document.getElementById('noteSubject'); d.innerHTML = '<option value="General">General</option>'; subjects.forEach(s => { d.innerHTML += `<option value="${s.code}">${s.code}</option>`; }); }
        document.getElementById('noteForm').addEventListener('submit', (e) => {
            e.preventDefault(); const t = document.getElementById('noteTitle').value, c = document.getElementById('noteSubject').value, co = document.getElementById('noteContent').value;
            if(edNId) { notes = notes.map(n => n.id === edNId ? { id: edNId, title: t, category: c, content: co } : n); edNId = null; }
            else { notes.push({ id: Date.now(), title: t, category: c, content: co }); }
            renNotes(); e.target.reset();
        });
        function renNotes() { const c = document.getElementById('notes-container'); c.innerHTML = ""; notes.forEach(n => { c.innerHTML += `<div class="system-bg border border-slate-700 p-4 rounded-lg relative hover:border-sky-500 transition"><span class="text-[9px] text-sky-400 font-bold uppercase block mb-1">${n.category}</span><h4 class="text-white font-bold uppercase mb-2">${n.title}</h4><p class="text-xs text-slate-500 mb-4 whitespace-pre-wrap">${n.content}</p><button onclick="edNote(${n.id})" class="text-sky-400 text-xs mr-2">Edit</button><button onclick="remNote(${n.id})" class="text-red-900 text-xs">Delete</button></div>`; }); }
        function edNote(id) { const n = notes.find(x => x.id === id); edNId = id; document.getElementById('noteTitle').value = n.title; document.getElementById('noteSubject').value = n.category; document.getElementById('noteContent').value = n.content; }
        function remNote(id) { notes = notes.filter(n => n.id !== id); renNotes(); }

        // --- TASKS/EVENTS/WALLET (Restored) ---
        document.getElementById('taskForm').addEventListener('submit', (e) => { e.preventDefault(); const d = { id: edTId||Date.now(), name: document.getElementById('taskName').value, cycle: document.getElementById('taskCycle').value, desc: document.getElementById('taskDesc').value }; if(edTId) { tasks = tasks.map(t=>t.id===edTId?d:t); edTId=null; } else tasks.push(d); renT(); e.target.reset(); });
        function renT() { const l = document.getElementById('taskList'); l.innerHTML = ""; tasks.forEach(t => l.innerHTML += `<tr><td class="p-4 text-white">${t.name}<p class="text-[10px] text-slate-500">${t.desc}</p></td><td class="p-4 text-sky-400 font-bold text-[9px]">${t.cycle}</td><td class="p-4 text-right"><button onclick="edTa(${t.id})" class="text-sky-400 mr-2"><i class="fas fa-edit text-xs"></i></button><button onclick="remT(${t.id})" class="text-red-900"><i class="fas fa-trash text-xs"></i></button></td></tr>`); }
        function edTa(id) { const t=tasks.find(x=>x.id===id); edTId=id; document.getElementById('taskName').value=t.name; document.getElementById('taskDesc').value=t.desc; showSection('task'); }
        function remT(id) { tasks=tasks.filter(t=>t.id!==id); renT(); }

        document.getElementById('eventForm').addEventListener('submit', (e) => { e.preventDefault(); const d = { id: edEId||Date.now(), name: document.getElementById('eventName').value, date: document.getElementById('eventDate').value, notes: document.getElementById('eventNotes').value }; if(edEId) { events = events.map(v=>v.id===edEId?d:v); edEId=null; } else events.push(d); renE(); e.target.reset(); });
        function renE() { const l = document.getElementById('eventList'); l.innerHTML = ""; events.forEach(v => l.innerHTML += `<tr><td class="p-4 text-sky-400 font-bold">${v.date}</td><td class="p-4 text-white">${v.name}<p class="text-[10px] text-slate-500">${v.notes}</p></td><td class="p-4 text-right"><button onclick="edEv(${v.id})" class="text-sky-400 mr-2"><i class="fas fa-edit text-xs"></i></button><button onclick="remE(${v.id})" class="text-red-900"><i class="fas fa-trash text-xs"></i></button></td></tr>`); }
        function edEv(id) { const v=events.find(x=>x.id===id); edEId=id; document.getElementById('eventName').value=v.name; document.getElementById('eventDate').value=v.date; document.getElementById('eventNotes').value=v.notes; showSection('event'); }
        function remE(id) { events=events.filter(v=>v.id!==id); renE(); }

        document.getElementById('walletForm').addEventListener('submit', (e) => { e.preventDefault(); const t = document.getElementById('walletType').value, a = parseFloat(document.getElementById('walletAmount').value), d = document.getElementById('walletDesc').value; if(edWId) { transactions = transactions.map(x => x.id === edWId ? { ...x, type:t, amount:a, desc:d } : x); edWId=null; } else { transactions.unshift({ id:Date.now(), type:t, amount:a, desc:d }); } calcW(); renW(); e.target.reset(); });
        function calcW() { balance = transactions.reduce((a, t) => t.type === 'deposit' ? a + t.amount : a - t.amount, 0.0); }
        function renW() { const l = document.getElementById('walletList'); document.getElementById('totalBalance').innerText = balance.toFixed(2); l.innerHTML = ""; transactions.forEach(t => l.innerHTML += `<tr><td class="p-4 text-white">${t.desc}</td><td class="p-4 text-center font-bold text-[9px] ${t.type==='deposit'?'text-emerald-400':'text-red-500'} uppercase">${t.type}</td><td class="p-4 text-right font-black ${t.type==='deposit'?'text-emerald-400':'text-red-500'}">${t.amount.toFixed(2)}</td><td class="p-4 text-right"><button onclick="edW(${t.id})" class="text-sky-400 mr-2"><i class="fas fa-edit"></i></button><button onclick="remW(${t.id})" class="text-red-900"><i class="fas fa-trash"></i></button></td></tr>`); }
        function edW(id) { const t=transactions.find(x=>x.id===id); edWId=id; document.getElementById('walletType').value=t.type; document.getElementById('walletAmount').value=t.amount; document.getElementById('walletDesc').value=t.desc; }
        function remW(id) { transactions=transactions.filter(t=>t.id!==id); calcW(); renW(); }

        // --- CALENDAR ---
        function setCalView(v) { calView = v; calOff = 0; document.querySelectorAll('.cal-v-btn').forEach(b => b.classList.remove('view-active')); document.getElementById(`${v}-btn`).classList.add('view-active'); renderCalendar(); }
        function navCal(o) { calOff += o; renderCalendar(); }
        function renderCalendar() {
            const container = document.getElementById('cal-body-container'); document.getElementById('cal-date-label').innerText = calOff === 0 ? "April 2026" : "May 2026"; container.innerHTML = "";
            if(calView === 'month') {
                container.innerHTML = `<div class="calendar-grid text-[10px] text-center font-bold text-sky-400 py-2"><div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div><div id="m-body" class="contents"></div></div>`;
                const start = calOff === 0 ? 3 : 5; for(let i=0; i<start; i++) document.getElementById('m-body').innerHTML += `<div class="calendar-day opacity-20"></div>`;
                for(let d=1; d<=30; d++) { const ds = `2026-04-${d.toString().padStart(2,'0')}`; const evs = events.filter(e => e.date === ds).map(e => `<div class="bg-sky-600 text-white text-[8px] p-0.5 mb-0.5 rounded truncate font-bold">${e.name}</div>`).join(''); document.getElementById('m-body').innerHTML += `<div class="calendar-day p-2 text-[10px] text-slate-700 font-bold">${d}<div class="mt-1">${evs}</div></div>`; }
            } else if(calView === 'week') {
                container.innerHTML = `<div class="grid grid-cols-7 h-full divide-x divide-slate-800"></div>`;
                for(let i=0; i<7; i++) { const dn = 26 + i + (calOff*7); const ds = `2026-04-${dn}`; const evs = events.filter(e => e.date === ds).map(e => `<div class="bg-sky-500 text-white p-2 rounded m-1 text-[10px] font-bold">${e.name}</div>`).join(''); container.firstChild.innerHTML += `<div class="p-2 text-center text-[10px] font-bold h-full uppercase text-sky-400 border-b border-slate-800">Day ${dn}<div class="mt-4">${evs}</div></div>`; }
            } else {
                const dn = 28 + calOff; const evs = events.filter(e => e.date === `2026-04-${dn}`).map(e => `<div class="bg-sky-900/40 p-6 rounded-xl m-6 system-border"><strong>${e.name}</strong><p class="text-sm text-slate-400 mt-2">${e.notes}</p></div>`).join(''); container.innerHTML = evs || `<p class="p-10 italic text-gray-500 text-sm">No events.</p>`;
            }
        }

        function updateHome() { if(tasks.length) document.getElementById('home-task-display').innerText = tasks[tasks.length-1].name; if(events.length) document.getElementById('home-event-display').innerText = events[events.length-1].name; document.getElementById('home-wallet-display').innerText = balance.toFixed(2); }
        showSection('home');
    </script>
</body>
</html>
